<div class="card">
  <h3>التدريب</h3>
  <p class="hint">أضف مادة وحدد عدد أسئلتها والأيام المتاحة لإنهائها.</p>
  <div class="fields">
   <div class="field">
    <label for="trainingSubject">اسم المادة</label>
    <select id="trainingSubject">
     <option value="">اختر المادة</option>
     <option>الرياضيات</option>
     <option>الفيزياء</option>
     <option>الكيمياء</option>
     <option>الأحياء</option>
     <option>أخرى</option>
    </select>
   </div>
   <div class="field">
    <label for="questionCount">عدد الأسئلة</label>
    <input id="questionCount" type="number" min="1" placeholder="مثال: 500">
   </div>
   <div class="field">
    <label for="questionDays">عدد الأيام</label>
    <input id="questionDays" type="number" min="1" placeholder="مثال: 10">
   </div>
  </div>
  <button class="btn" id="addTraining">إضافة خطة تدريب</button>
  <div class="output" id="trainingMessage" hidden></div>
  <div class="separator"></div>
  <div id="trainingItems"><div class="empty">لا توجد خطط تدريب حتى الآن.</div></div>
</div>
