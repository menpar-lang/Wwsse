
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الإذاعة | ثانوية الشقيقة</title>
<style>
:root{
 --sky:#37c4ed;
 --blue:#087caf;
 --navy:#092b49;
 --dark:#061322;
 --white:#f2f9ff;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 background:linear-gradient(145deg,#128fbd,#092d4d 50%,#050b16);
 color:var(--white);
 min-height:100vh;
}
button,input{font:inherit}
header{
 padding:35px 18px 28px;
 text-align:center;
 background:linear-gradient(120deg,#21b5e4,#0875a6,#082b49);
 border-bottom:1px solid #ffffff30;
}
header h1{font-size:32px;margin:0 0 12px}
header .sub{color:#e0f6ff;font-size:15px}
header .details{font-size:13px;line-height:2;color:#d5efff;margin-top:13px}
.container{max-width:1150px;margin:auto;padding:25px 17px 50px}
.page{display:none;animation:appear .25s ease}
.page.active{display:block}
@keyframes appear{
 from{opacity:0;transform:translateY(7px)}
 to{opacity:1;transform:translateY(0)}
}
.heading{
 font-size:23px;
 margin:10px 0 8px;
}
.description{color:#c9e6f5;font-size:14px;line-height:1.9;margin:0 0 22px}
.search{
 display:flex;gap:10px;margin:22px 0;
}
.search input{
 flex:1;min-width:0;
 padding:15px 17px;
 background:#ffffff15;
 border:1px solid #ffffff40;
 border-radius:12px;
 color:white;outline:none;
}
.search input:focus{border-color:var(--sky)}
.search input::placeholder{color:#c6ddea}
button{
 border:0;cursor:pointer;
 transition:.2s;
}
button:hover{filter:brightness(1.12)}
.primary{
 background:var(--sky);color:#06243a;
 padding:13px 20px;border-radius:11px;font-weight:bold;
}
.secondary{
 background:#ffffff16;color:white;
 border:1px solid #ffffff35;
 padding:11px 17px;border-radius:11px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
 gap:15px;
}
.category{
 min-height:145px;
 padding:22px;
 border:1px solid #ffffff2c;
 border-radius:17px;
 background:linear-gradient(145deg,#ffffff24,#ffffff09);
 cursor:pointer;
 transition:.2s;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
}
.category:hover{
 transform:translateY(-4px);
 border-color:#60d5fa;
 background:#ffffff25;
}
.category h3{font-size:18px;margin:0 0 15px}
.category p{font-size:13px;color:#c5e4f4;margin:0}
.category .count{font-size:12px;color:#78dcfa;margin-top:15px}
.radio-card{
 padding:20px;
 border-radius:14px;
 border:1px solid #ffffff2c;
 background:#ffffff12;
 cursor:pointer;
 transition:.2s;
}
.radio-card:hover{background:#ffffff25;transform:translateY(-3px)}
.radio-card h3{font-size:16px;margin:0 0 10px}
.radio-card p{font-size:13px;color:#c7e3f2;margin:0}
.topbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.empty{
 grid-column:1/-1;
 padding:30px;
 text-align:center;
 background:#ffffff12;
 border-radius:12px;
 color:#d7eaf5;
}
#radioPaper{
 background:#fff;color:#203343;
 border-radius:16px;
 padding:35px;
 margin-top:20px;
 line-height:2.05;
}
#radioPaper h1{
 text-align:center;color:#075b83;
 font-size:27px;margin:0 0 8px;
}
#radioPaper .school{
 text-align:center;color:#647b8c;font-size:14px;
}
#radioPaper h2{
 color:#0877a6;font-size:19px;
 margin:24px 0 6px;
 padding-bottom:5px;
 border-bottom:1px solid #dce7ee;
}
#radioPaper p{margin:8px 0;font-size:16px}
.paper-footer{
 text-align:center;
 border-top:1px solid #dce7ee;
 margin-top:30px;padding-top:15px;
 color:#627c8d;font-size:13px;
}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
footer{
 text-align:center;padding:25px 10px;
 border-top:1px solid #ffffff20;
 color:#b9d9e9;font-size:13px;
}
@media(max-width:600px){
 header h1{font-size:26px}
 .search{flex-direction:column}
 #radioPaper{padding:20px}
}
@media print{
 body{background:white;color:black}
 header,footer,.container>.page:not(#radioPage),
 #radioPage .topbar,#radioPage .actions{display:none!important}
 #radioPage{display:block!important;padding:0!important}
 #radioPaper{margin:0;padding:10px;border:0;border-radius:0}
 #radioPaper h1,#radioPaper h2{color:#111}
}
</style>
</head>
<body>

<header>
 <h1>مكتبة الإذاعة المدرسية</h1>
 <div class="sub">ثانوية الشقيقة</div>
 <div class="details">

</header>

<main class="container">

 <div class="search">
  <input id="searchInput" placeholder="ابحث عن قسم أو إذاعة..." type="search">

 </div>

 <div id="categoriesGrid" class="grid"></div>
 <div id="resultsGrid" class="grid" style="display:none"></div>
</section>

<!-- صفحة القسم -->
<section id="categoryPage" class="page">
 <div class="topbar">
  <button class="secondary" onclick="showPage('homePage')">← جميع الأقسام</button>
 </div>
 <h2 class="heading" id="categoryName"></h2>
 <p class="description">اختر إحدى الإذاعات العشر لعرض محتواها كاملًا.</p>
 <div id="radiosGrid" class="grid"></div>
</section>

<!-- صفحة الإذاعة -->
<section id="radioPage" class="page">
 <div class="topbar">
  <button class="secondary" onclick="showPage('categoryPage')">← العودة إلى الإذاعات</button>
  <button class="secondary" onclick="showPage('homePage')">الرئيسية</button>
 </div>
 <div class="actions">
  <button class="primary" onclick="window.print()">طباعة / حفظ PDF</button>
 </div>
 <article id="radioPaper"></article>
</section>

</main>

<footer>مكتبة الإذاعة المدرسية | ثانوية الشقيقة</footer>
