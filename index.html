<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إذاعة ثانوية الشقيقة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#000;--card:#0d0d0d;--line:#2a2a2a;--tx:#f3efe4;--mu:#9a968b;--ac:#d4a94a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;line-height:1.9}
header{padding:36px 18px 26px;text-align:center;border-bottom:1px solid var(--line)}
header h1{font-family:'Reem Kufi',Tahoma,serif;font-size:clamp(30px,7vw,52px);margin:0;color:var(--ac);line-height:1.3}
header p{margin:6px 0 0;color:var(--mu)}
header b{color:var(--tx)}
main{max-width:960px;margin:0 auto;padding:22px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--tx);text-decoration:none;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--ac);outline:none}
.card .ic{font-size:26px}
.card h3{margin:4px 0 0;font-size:19px;font-family:'Reem Kufi',Tahoma,serif}
.card small{color:var(--mu)}
.crumb{margin:0 0 14px;color:var(--mu);font-size:15px}
.crumb a{color:var(--ac);text-decoration:none}
h2{font-family:'Reem Kufi',Tahoma,serif;color:var(--ac);font-size:28px;margin:6px 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
button{font:inherit;background:var(--ac);color:#000;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
ol.list{list-style:none;margin:0;padding:0}
ol.list li a{display:block;padding:12px 14px;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none}
ol.list li a:hover{background:var(--card);color:var(--ac)}
.bc{border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:22px;background:var(--card)}
.bc h2{margin-top:0}
.seg{padding:12px 0;border-top:1px solid var(--line)}
.seg h4{margin:0 0 2px;color:var(--ac);font-size:17px}
.seg p{margin:0}
.bc .hd{color:var(--mu);font-size:14px;margin:0 0 8px}
footer{text-align:center;color:var(--mu);padding:24px 14px 34px;border-top:1px solid var(--line);font-size:15px}
footer b{color:var(--tx)}
.ph{display:none}
@media print{
 @page{margin:16mm}
 html,body{background:#fff!important;color:#000!important}
 header,footer,.crumb,.bar,.card{border-color:#999}
 header{padding:0 0 10px}header h1,h2,.seg h4{color:#000!important}header p,.bc .hd{color:#333}
 .no-print{display:none!important}
 .bc{background:#fff;border:0;padding:0;margin:0;page-break-after:always;break-after:page}
 .bc:last-child{page-break-after:auto}
 .seg{border-color:#bbb;break-inside:avoid}
 .ph{display:block;text-align:center;font-size:13px;color:#333;border-bottom:1px solid #000;margin-bottom:10px;padding-bottom:6px}
 main{padding:0}
}
</style>
</head>
<body>
<header class="no-print-h">
<h1>إذاعة ثانوية الشقيقة</h1>
<p>مدير المدرسة: <b>الأستاذ عيد حرمل</b></p>
</header>

{n:"الوطن والهوية",i:"🇸🇦",d:[

{n:"الأسرة والمجتمع",i:"🏡",d:[

var app=document.getElementById('app');
function q(s){return 'سورة '+s.replace(/ (?=[٠-٩\-]+$)/,': ')}
function bc(si,bi){
 var p=S[si].d[bi].split('|'),t=p[0];
 var seg=[
 ['افتتاح الإذاعة','بسم الله الرحمن الرحيم، الحمد لله رب العالمين، والصلاة والسلام على أشرف الأنبياء والمرسلين، نبينا محمد وعلى آله وصحبه أجمعين. أيها الطلاب الأعزاء، السلام عليكم ورحمة الله وبركاته، صباح الخير والنشاط، نرحب بكم في إذاعة ثانوية الشقيقة، وحديثنا اليوم عن: «'+t+'».'],
 ['تلاوة عطرة','نستمع إلى آيات بينات من الذكر الحكيم، من '+q(p[1])+'، يتلوها الطالب: ................'],
 ['حديث شريف','يقرأ الطالب: ................ قال رسول الله ﷺ: '+p[2]+'.'],
 ['كلمة الصباح',p[3]+' نسأل الله أن ينفعنا بما نسمع.'],
 ['فقرة للنقاش','سؤال لطلابنا: كيف يمكنني أن أطبق «'+t+'» في يومي هذا داخل المدرسة وخارجها؟ يجيب طالبان أو ثلاثة.'],
 ['دعاء','اللهم علمنا ما ينفعنا، وانفعنا بما علمتنا، وزدنا علما. اللهم احفظ بلادنا وولاة أمرنا، وبارك لنا في أعمارنا وأوقاتنا. آمين.'],
 ['كلمة الإدارة','يتحدث مدير المدرسة الأستاذ عيد حرمل، أو من ينوب عنه، بتوجيهات اليوم.'],
 ['الختام والنشيد الوطني','نشكر لكم حسن الاستماع والانتباه، وإلى لقاء جديد بإذن الله. والسلام عليكم ورحمة الله وبركاته. وننتقل الآن إلى النشيد الوطني: «سارعي للمجد والعلياء».']];
 var h='<article class="bc"><div class="ph">إذاعة ثانوية الشقيقة · مدير المدرسة: عيد حرمل · عمل الطالب: سعد بجاد</div><p class="hd">'+S[si].n+' — الإذاعة '+(bi+1)+'</p><h2>'+t+'</h2>';
 seg.forEach(function(s,i){h+='<div class="seg"><h4>'+(i+1)+'. '+s[0]+'</h4><p>'+s[1]+'</p></div>'});
 return h+'</article>';
}
function render(){
 var m=/^s(\d+)(?:-(\d+|all))?$/.exec(location.hash.slice(1)),h='';
 var si=m?+m[1]-1:-1;
 if(si<0||si>9){
  h='<h2>أقسام الإذاعة</h2><div class="grid">';
  S.forEach(function(s,i){h+='<a class="card" href="#s'+(i+1)+'"><h3>'+s.n+'</h3><small>١٠ إذاعات كاملة</small></a>'});
  h+='</div>';
 }else if(!m[2]){
  h='<p class="crumb"><a href="#">الأقسام</a> / '+S[si].n+'</p><h2>'+S[si].n+'</h2><div class="bar"><button onclick="location.hash=\'s'+(si+1)+'-all\'">عرض القسم كاملا للطباعة</button></div><ol class="list">';
  S[si].d.forEach(function(d,i){h+='<li><a href="#s'+(si+1)+'-'+(i+1)+'">'+(i+1)+'. '+d.split('|')[0]+'</a></li>'});
  h+='</ol>';
 }else{
  var all=m[2]=='all',bi=all?0:+m[2]-1;
  h='<p class="crumb no-print"><a href="#">الأقسام</a> / <a href="#s'+(si+1)+'">'+S[si].n+'</a></p><div class="bar no-print"><button onclick="window.print()">طباعة / حفظ PDF</button><button class="alt" onclick="location.hash=\'s'+(si+1)+'\'">رجوع</button></div>';
  if(all)for(var i=0;i<10;i++)h+=bc(si,i);else h+=bc(si,bi);
 }
 app.innerHTML=h;window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);render();
