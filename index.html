
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الإذاعة المدرسية | ثانوية الشقيقة</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Tahoma,Arial,sans-serif;
 color:#edf7ff;
 background:linear-gradient(145deg,#168fc4 0%,#092e50 48%,#050b17 100%);
 min-height:100vh
}
button,input{font-family:inherit}
header{
 padding:35px 18px;text-align:center;
 background:linear-gradient(120deg,#159dcc,#07517d,#09213b);
 border-bottom:1px solid #ffffff25
}
header h1{font-size:34px;margin:0 0 12px}
header p{margin:7px;color:#d7efff}
.school-info{font-size:14px;line-height:2}
.container{max-width:1150px;margin:auto;padding:25px 16px}
.section-title{font-size:23px;margin:20px 0}
.search-area{display:flex;gap:10px;margin:20px 0}
.search-area input{
 flex:1;min-width:0;padding:15px;border:1px solid #ffffff35;
 border-radius:12px;background:#ffffff12;color:white;font-size:16px;
 outline:none
}
input::placeholder{color:#c6d9e8}
.btn{
 border:0;border-radius:11px;padding:13px 20px;
 background:#39b9e9;color:#06223a;font-weight:bold;
 cursor:pointer;font-size:15px
}
.btn:hover{filter:brightness(1.1)}
.btn.secondary{background:#ffffff20;color:white;border:1px solid #ffffff35}
.grid{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:15px
}
.category{
 padding:22px 18px;background:linear-gradient(145deg,#ffffff20,#ffffff08);
 border:1px solid #ffffff25;border-radius:16px;
 cursor:pointer;transition:.2s;min-height:125px
}
.category:hover{transform:translateY(-4px);background:#ffffff25}
.category h3{margin:0 0 12px;font-size:18px}
.category p{margin:0;color:#c8e4f5;font-size:14px}
.radio-card{
 background:#ffffff12;border:1px solid #ffffff25;
 padding:17px;border-radius:13px;cursor:pointer
}
.radio-card:hover{background:#ffffff25}
.radio-card h3{font-size:16px;margin:0 0 9px}
.radio-card p{font-size:13px;color:#c8e4f5;margin:0}
.hidden{display:none!important}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{margin-bottom:18px}
#radioContent{
 background:#fff;color:#172b3c;border-radius:14px;
 padding:35px;margin-top:20px;line-height:2.1
}
#radioContent h1{text-align:center;color:#07517d;font-size:27px}
#radioContent h2{
 color:#07517d;border-bottom:1px solid #d9e6ef;
 padding-bottom:5px;margin-top:25px;font-size:20px
}
#radioContent p{margin:8px 0;font-size:16px}
.radio-footer{text-align:center;margin-top:30px;color:#547083}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.empty{text-align:center;padding:35px;color:#cce4f4}
footer{text-align:center;padding:30px 10px;color:#c6d9e8;font-size:13px}
@media(max-width:600px){
 header h1{font-size:26px}
 #radioContent{padding:20px}
 .search-area{flex-direction:column}
}
@media print{
 body{background:white!important;color:#111!important}
 header,.container:not(#radioPage),footer,.actions,.back{display:none!important}
 #radioPage{display:block!important;padding:0!important}
 #radioContent{margin:0;padding:15px;border:0}
 #radioContent h1,#radioContent h2{color:#111}
}
</style>
</head>
<body>

<header>
 <h1>مكتبة الإذاعة المدرسية</h1>
 <p>ثانوية الشقيقة</p>

  مدير المدرسة: عيد حرمل<br>

</header>

<main class="container">

   <input id="searchInput" type="search" placeholder="ابحث عن قسم أو إذاعة...">
   <button class="btn" onclick="searchRadios()">بحث</button>
  </div>
  <div id="categoryGrid" class="grid"></div>
  <div id="searchResults" class="grid hidden"></div>
 </section>

 <section id="categoryPage" class="hidden">
  <button class="btn secondary back" onclick="goHome()">العودة للأقسام</button>
  <h2 class="section-title" id="categoryTitle"></h2>
  <p>اختر الإذاعة التي ترغب في عرضها.</p>
  <div id="radioGrid" class="grid"></div>
 </section>

 <section id="radioPage" class="hidden">
  <button class="btn secondary back" onclick="goBackCategory()">العودة إلى الإذاعات</button>
  <div class="actions">
   <button class="btn" onclick="window.print()">طباعة / حفظ PDF</button>
   <button class="btn secondary" onclick="goHome()">الرئيسية</button>
  </div>
  <article id="radioContent"></article>
 </section>

</main>

<footer>
